<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
  // Evita el "flash" de tema claro antes de aplicar el tema guardado
  (function () {
    try {
      var t = localStorage.getItem('solemio-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoleMio — Mensajes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/catalogo.css">
<link rel="stylesheet" href="css/mensajes.css">
</head>
<body>

<div id="app" style="display:none">
  <div class="shell">

    <!-- TOPBAR (contenido inyectado por topbar.js, igual en todas las páginas) -->
    <header class="topbar" id="topbar-slot"></header>

    <div class="ig-aviso" id="ig-aviso" hidden></div>

    <!-- BANDEJA: lista de conversaciones | hilo abierto.
         En mobile se ve uno solo a la vez (clase .hilo-abierto). -->
    <div class="ig-inbox" id="ig-inbox">

      <aside class="ig-lista-panel">
        <div class="ig-lista-head">
          <h1 class="ig-titulo">Mensajes</h1>
          <button type="button" class="btn sm ghost" id="ig-btn-sync" onclick="sincronizarUI()" title="Traer conversaciones anteriores desde Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            <span id="ig-btn-sync-label">Sincronizar</span>
          </button>
        </div>
        <div class="search-wrap ig-buscar">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="ig-buscar" placeholder="Buscar por usuario o nombre…" oninput="renderListaUI()" autocomplete="off">
        </div>
        <div class="ig-lista" id="ig-lista">
          <div class="empty">Cargando conversaciones…</div>
        </div>
      </aside>

      <section class="ig-hilo-panel">
        <div class="ig-hilo-vacio" id="ig-hilo-vacio">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          Elegí una conversación para leerla
        </div>

        <div class="ig-hilo" id="ig-hilo" hidden>
          <header class="ig-hilo-head" id="ig-hilo-head"></header>
          <div class="ig-mensajes" id="ig-mensajes"></div>
          <div class="ig-ventana" id="ig-ventana"></div>
          <form class="ig-composer" id="ig-composer" onsubmit="enviarUI(event)">
            <textarea id="ig-texto" rows="1" maxlength="1000" placeholder="Escribí una respuesta…" onkeydown="teclaComposerUI(event)" oninput="autoAlturaUI(this)"></textarea>
            <button type="submit" class="btn primary" id="ig-btn-enviar">Enviar</button>
          </form>
        </div>
      </section>

    </div>

  </div><!-- /shell -->

  <footer class="site-footer" id="footer-slot"></footer>
</div><!-- /app -->

<script type="module" src="js/mensajes.js"></script>
</body>
</html>
