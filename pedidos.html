<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
  // Evita el "flash" de tema claro antes de aplicar el tema guardado
  (function () {
    try {
      var t = localStorage.getItem('solemio-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoleMio — Pedidos</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/catalogo.css">
<link rel="stylesheet" href="css/pedidos.css">
</head>
<body>

<div id="app" style="display:none">
  <div class="shell">

    <!-- TOPBAR (contenido inyectado por topbar.js, igual en todas las páginas) -->
    <header class="topbar" id="topbar-slot"></header>

    <!-- PEDIDOS -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="buscar-pedido" placeholder="Buscar por nombre o teléfono…" oninput="renderPedidos()" autocomplete="off">
      </div>
      <select id="filtro-estado" onchange="renderPedidos()">
        <option value="">Todos los estados</option>
        <option value="espera">En espera</option>
        <option value="revisado">Revisado</option>
        <option value="confirmado">Confirmado</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <select id="orden-pedido" onchange="renderPedidos()">
        <option value="fecha_desc">Más recientes primero</option>
        <option value="fecha_asc">Más antiguos primero</option>
        <option value="telefono_asc">Teléfono (A-Z)</option>
        <option value="telefono_desc">Teléfono (Z-A)</option>
      </select>
      <button type="button" class="btn ghost" id="btn-ver-archivados" onclick="toggleArchivadosUI()">Ver archivados</button>
      <button class="btn primary" onclick="abrirNuevoPedidoUI()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Nuevo pedido
      </button>
    </div>

    <div id="pedidos-lista" class="pedidos-lista">
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Cargando pedidos…
      </div>
    </div>

  </div><!-- /shell -->

  <footer class="site-footer" id="footer-slot"></footer>
</div><!-- /app -->

<div id="modal-pedido"></div>
<div id="modal-nuevo-pedido"></div>

<script type="module" src="js/pedidos.js"></script>
</body>
</html>
