<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
  // Evita el "flash" de tema claro antes de aplicar el tema guardado
  (function () {
    try {
      var t = localStorage.getItem('solemio-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoleMio — Producto</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="catalogo.css">
<link rel="stylesheet" href="producto.css">
</head>
<body>

<div id="app" style="display:none">
  <div class="shell">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="logo">
        <a href="landing.html" class="logo-link">
          <span class="logo-word">SoleMio</span>
        </a>
      </div>
      <div class="topbar-right">
        <nav class="topbar-nav">
          <a href="landing.html">Inicio</a>
          <a href="catalogo.html" class="active">Catálogo</a>
          <a href="contacto.html">Contacto</a>
        </nav>
        <span class="role-badge" id="role-badge"></span>
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Cambiar tema"></button>
        <button class="icon-btn logout-btn" onclick="doLogout()" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;stroke:currentColor">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- DETALLE DE PRODUCTO -->
    <div id="producto-content" class="product-wrap">
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Cargando producto…
      </div>
    </div>

  </div><!-- /shell -->
</div><!-- /app -->

<script type="module" src="producto.js"></script>
</body>
</html>
