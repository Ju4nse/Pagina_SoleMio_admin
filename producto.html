<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- Google tag (gtag.js) — no se carga en navegadores de admin
     (marcados con localStorage 'solemio-no-analytics' por esAdmin()) -->
<script>
  (function () {
    try { if (localStorage.getItem('solemio-no-analytics') === '1') return; } catch (e) {}
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-388BR5RWM5';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', 'G-388BR5RWM5');
  })();
</script>
<script>
  // Evita el "flash" de tema claro antes de aplicar el tema guardado
  (function () {
    try {
      var t = localStorage.getItem('solemio-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Título/descripción/og genéricos: en el sitio publicado el Worker
     (worker/index.js) los reemplaza con los datos del producto antes de
     mandar la página, así la vista previa de WhatsApp/Instagram (que no
     ejecuta JS) muestra el producto. En local, y como respaldo si el
     Worker no encuentra el producto, producto.js los actualiza al cargar. -->
<title>SoleMio — Producto</title>
<meta name="description" content="Mirá el detalle de este producto de SoleMio — lencería y corsetería en Tandil.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SoleMio">
<meta property="og:title" content="SoleMio — Producto">
<meta property="og:description" content="Mirá el detalle de este producto de SoleMio — lencería y corsetería en Tandil.">
<meta property="og:image" content="https://solemiotandil.com.ar/img/logo-wordmark-extendido.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="SoleMio — Producto">
<meta name="twitter:description" content="Mirá el detalle de este producto de SoleMio — lencería y corsetería en Tandil.">
<meta name="twitter:image" content="https://solemiotandil.com.ar/img/logo-wordmark-extendido.png">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/catalogo.css">
<link rel="stylesheet" href="css/producto.css">
</head>
<body>

<div id="app" style="display:none">
  <div class="shell">

    <!-- TOPBAR (contenido inyectado por topbar.js, igual en todas las páginas) -->
    <header class="topbar" id="topbar-slot"></header>

    <!-- DETALLE DE PRODUCTO -->
    <div id="producto-content" class="product-wrap">
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Cargando producto…
      </div>
    </div>

  </div><!-- /shell -->

  <footer class="site-footer" id="footer-slot"></footer>

  <!-- MODAL DE EDICIÓN (se abre acá mismo, sin ir a catalogo.html) -->
  <div id="modal-prod"></div>
  <div id="modal-carrito"></div>
  <div id="modal-zoom"></div>

</div><!-- /app -->

<script type="module" src="js/producto.js"></script>
</body>
</html>
