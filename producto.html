<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
  // Evita el "flash" de tema claro antes de aplicar el tema guardado
  (function () {
    try {
      var t = localStorage.getItem('solemio-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- El título/descripción de acá abajo son un fallback genérico: el
     contenido real de esta página lo arma producto.js con lo que trae
     de Supabase, y ahí mismo actualiza <title> y esta descripción con
     los datos del producto una vez que cargan (ver actualizarMetaSEO
     en producto.js). Los crawlers que no ejecutan JS (como el de
     WhatsApp al armar la vista previa de un link) van a ver esta
     versión genérica igual, no la del producto puntual. -->

</div><!-- /app -->
