<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SoleMio — Catálogo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="login-screen" class="login-wrapper" style="display:none;">
    <div class="login-card">
      <div class="login-header">
        <img class="login-logo-img" src="logo.png" alt="Logo" onerror="this.src='https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=120&auto=format&fit=crop&q=60'">
        <h2>SoleMio</h2>
      </div>
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="login-user" placeholder="admin">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>
      <div id="login-error" class="login-error"></div>
      <button class="btn primary" onclick="doLogin()">Ingresar como Admin</button>
      <button class="btn ghost" onclick="loginComoInvitado()">Ver catálogo (Invitado)</button>
    </div>
  </div>

  <div id="app" class="layout" style="display:none;">
    <aside class="sidebar">
      <div class="brand">👟 SoleMio</div>
      <nav class="menu">
        <button class="nav-btn active" data-tab="catalog" onclick="switchTab('catalog')">Catálogo</button>
        <button class="nav-btn" data-tab="sync" onclick="switchTab('sync')">Sincronizar</button>
        <button class="nav-btn" data-tab="config" onclick="switchTab('config')">Config</button>
      </nav>
      <button class="btn ghost sm" style="width:100%" onclick="doLogout()">Cerrar Sesión</button>
    </aside>

    <main class="content">
      <section id="tab-catalog" class="tab-content active">
        <div class="toolbar">
          <input type="text" id="buscar" placeholder="Buscar por nombre, marca o ID..." oninput="renderCatalogo()">
        </div>
        <div id="catalogo-grid" class="products-grid"></div>
      </section>

      <section id="tab-sync" class="tab-content">
        <h3>Sincronización</h3>
        <p>Disparar actualización desde Excel:</p>
        <button id="btn-sincro" class="btn primary" onclick="sincronizarCatalogo()">Sincronizar Ahora</button>
        <div id="sincro-status" style="margin-top:1rem;"></div>
      </section>

      <section id="tab-config" class="tab-content">
        <h3>Configuración</h3>
        <input type="password" id="cfg-token" placeholder="GitHub PAT">
        <input type="text" id="cfg-repo" placeholder="usuario/repo">
        <button class="btn primary" onclick="guardarConfig()">Guardar</button>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
