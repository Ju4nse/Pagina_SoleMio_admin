<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
  // Evita el "flash" de tema claro antes de aplicar el tema guardado
  (function () {
    try {
      var t = localStorage.getItem('solemio-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoleMio — Lencería</title>
<meta name="description" content="SoleMio — Lencería. Mirá el catálogo completo y encontrá tu talle.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="landing.css">
</head>
<body>

<header class="site-header">
  <div class="logo">
    <a href="landing.html" class="logo-link">
      <span class="logo-word">SoleMio</span>
    </a>
  </div>
  <nav class="site-nav">
    <a href="landing.html" class="active">Inicio</a>
    <a href="#" onclick="verCatalogo();return false;">Catálogo</a>
    <a href="contacto.html">Contacto</a>
  </nav>
  <div class="site-header-right">
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Cambiar tema"></button>
    <a class="account-link" href="login.html" aria-label="Ingresar" title="Ingresar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
    </a>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-inner">
    <img src="logo.png" alt="SoleMio" class="hero-logo-img"
         onerror="this.style.display='none'">
    <h1>Lencería que te acompaña</h1>
    <p class="hero-sub">Encontrá tu talle, tu color, tu estilo. Catálogo actualizado con stock real.</p>
    <div class="hero-actions">
      <button class="btn primary hero-btn" onclick="verCatalogo()">
        Ver catálogo
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
      <a class="btn hero-btn-secondary" href="contacto.html">Contacto</a>
    </div>
  </div>
</section>

<!-- DESTACADOS / NOVEDADES -->
<section class="destacados">
  <div class="destacados-inner">
    <div class="destacados-hd">
      <h2>Destacados</h2>
      <a href="#" onclick="verCatalogo();return false;" class="destacados-link">Ver todo →</a>
    </div>
    <div id="destacados-grid" class="destacados-grid">
      <div class="empty">Cargando destacados…</div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="site-footer-links">
    <a href="https://www.instagram.com/solemio.tandil/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/>
        <circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor"/></svg>
      Instagram
    </a>
    <a href="https://wa.me/542494003595" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      WhatsApp
    </a>
    <a href="contacto.html">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Dirección y horarios
    </a>
  </div>
  <div class="site-footer-copy">© <span id="year"></span> SoleMio</div>
</footer>

<script type="module" src="landing.js"></script>
</body>
</html>
