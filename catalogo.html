<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoleMio — Catálogo</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="catalogo.css">
</head>
<body>

<div id="app" style="display:none">
  <div class="shell">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="logo">
        <span class="logo-word">SoleMio</span>
        <span class="logo-tag">Catálogo</span>
      </div>
      <div class="topbar-right">
        <span class="role-badge" id="role-badge"></span>
        <button class="btn sm ghost" id="account-btn" onclick="openAccountModal()" title="Mi cuenta">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;stroke:currentColor">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </button>
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" aria-label="Cambiar tema"></button>
        <button class="btn sm ghost logout-btn" onclick="doLogout()" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;stroke:currentColor">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- CATÁLOGO -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="buscar" placeholder="Buscar producto, marca…" oninput="renderCatalogo()" autocomplete="off">
      </div>
      <select id="filtro-marca" onchange="renderCatalogo()">
        <option value="">Todas las marcas</option>
      </select>
      <select id="filtro-stock" onchange="renderCatalogo()">
        <option value="">Todo el stock</option>
        <option value="in stock">En stock</option>
        <option value="out of stock">Sin stock</option>
      </select>
      <button class="btn primary" onclick="openProdModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Nuevo producto
      </button>
    </div>

    <div id="catalogo-grid" class="prod-grid">
      <div class="empty" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        Cargando catálogo…
      </div>
    </div>

  </div><!-- /shell -->
</div><!-- /app -->

<!-- Modales -->
<div id="modal-view"></div>
<div id="modal-prod"></div>
<div id="modal-account"></div>

<script type="module" src="catalogo.js"></script>
</body>
</html>
