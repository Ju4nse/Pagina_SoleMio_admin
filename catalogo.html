<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<script>
  // Evita el "flash" de tema claro antes de aplicar el tema guardado
  (function () {
    try {
      var t = localStorage.getItem('solemio-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoleMio — Catálogo</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="catalogo.css">
</head>
<body>

<div id="app" style="display:none">
  <div class="shell">

    <!-- TOPBAR (contenido inyectado por topbar.js, igual en todas las páginas) -->
    <header class="topbar" id="topbar-slot"></header>

    <!-- CATÁLOGO -->
    <div class="catalogo-layout">

      <aside class="catalogo-sidebar" id="catalogo-sidebar">
        <!-- "Marcas" acá solo se ve en mobile (ver catalogo.css) para
             quedar a la misma altura que "Categoría" — en desktop
             Marcas sigue viviendo únicamente en la topbar. Mismo panel
             (misma clase .marcas-panel), lo llena renderMarcasMenu()
             en catalogo.js igual que al de la topbar. -->
        <div class="filtros-triggers-row">
          <button type="button" class="sidebar-title sidebar-title-trigger" id="marcas-trigger-mobile" onclick="toggleMarcasMobileUI()">
            Marcas
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <button type="button" class="sidebar-title sidebar-title-trigger" id="categoria-trigger" onclick="toggleCategoriaSidebarUI()">
            Categoría
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
        </div>
        <div class="marcas-panel" id="marcas-panel-mobile"></div>
        <ul class="categoria-list" id="categoria-list"></ul>
      </aside>

      <div class="catalogo-main">
        <div class="toolbar">
          <select id="filtro-stock" onchange="renderCatalogo()">
            <option value="">Todo el stock</option>
            <option value="in stock">En stock</option>
            <option value="out of stock">Sin stock</option>
          </select>
          <button class="btn primary" style="margin-left:auto" onclick="openProdModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            Nuevo producto
          </button>
        </div>

        <div id="marca-activa" class="marca-activa-banner" style="display:none"></div>

        <div id="catalogo-grid" class="prod-grid">
          <div class="empty" style="grid-column:1/-1">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            Cargando catálogo…
          </div>
        </div>
      </div>

    </div>

  </div><!-- /shell -->

  <footer class="site-footer" id="footer-slot"></footer>
</div><!-- /app -->

<!-- Modales -->
<div id="modal-prod"></div>
<div id="modal-account"></div>
<div id="modal-carrito"></div>

<script type="module" src="catalogo.js"></script>
</body>
</html>
