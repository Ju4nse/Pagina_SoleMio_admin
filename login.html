<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- Google tag (gtag.js) — no se carga en navegadores de admin
     (marcados con localStorage 'solemio-no-analytics' por esAdmin()) -->
<script>
  (function () {
    try { if (localStorage.getItem('solemio-no-analytics') === '1') return; } catch (e) {}
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=G-388BR5RWM5';
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date());
    gtag('config', 'G-388BR5RWM5');
  })();
</script>
<script>
  // Evita el "flash" de tema claro antes de aplicar el tema guardado
  (function () {
    try {
      var t = localStorage.getItem('solemio-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoleMio — Ingresar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<!-- ── PANTALLA DE LOGIN ─────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-img-wrap">
        <img src="img/logo-wordmark-extendido.png" alt="SoleMio, lencería y corsetería" class="login-logo-img"
             onerror="this.style.display='none';document.getElementById('login-logo-text').style.display='block'">
        <span class="logo-word" id="login-logo-text" style="display:none">SoleMio</span>
      </div>
      <span class="logo-tag">Panel de administración</span>
    </div>

    <div class="field">
      <label for="login-user">Usuario</label>
      <input type="text" id="login-user" placeholder="admin"
             autocomplete="username" onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <div class="field" style="position:relative">
      <label for="login-pass">Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••"
             autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
      <button type="button" class="toggle-pass" onclick="togglePass()" aria-label="Ver contraseña">
        <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <div class="login-error" id="login-error"></div>
    <button type="button" class="btn primary login-btn" onclick="doLogin()">Ingresar</button>

    <div class="login-divider"><span>o</span></div>

    <button type="button" class="btn guest-btn" onclick="doGuestLogin()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Ver catálogo como invitado
    </button>

    <p class="login-hint">Acceso restringido al personal autorizado</p>
    <p class="login-hint">
      <a href="landing.html" class="login-back">Volver al sitio</a>
    </p>
  </div>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
